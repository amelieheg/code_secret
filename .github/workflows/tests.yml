name: Tests des règles

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Vérifier la syntaxe
        run: npm run check
      - name: Tester les règles
        run: npm test
